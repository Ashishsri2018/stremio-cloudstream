name: Build CS3 Plugins (dev)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # JitPack builds snapshots on demand and occasionally returns 404 while
      # (re)building after a cache purge; Gradle does not retry those.
      - name: Warm up the Cloudstream Gradle plugin on JitPack
        run: |
          base="https://jitpack.io/com/github/recloudstream/gradle/gradle/master-SNAPSHOT"
          version=""
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/jitpack-metadata.xml -w "%{http_code}" "$base/maven-metadata.xml" || true)
            if [ "$code" = "200" ]; then
              version=$(grep -oP '(?<=<version>)[^<]+' /tmp/jitpack-metadata.xml | head -n1)
              if [ -n "$version" ]; then
                echo "JitPack metadata resolved: $version"
                break
              fi
            fi
            echo "Attempt $i: metadata HTTP $code, retrying in 15s"
            sleep 15
          done
          for i in $(seq 1 24); do
            pom=$(curl -s -o /dev/null -w "%{http_code}" "$base/gradle-${version}.pom" || true)
            jar=$(curl -s -o /dev/null -w "%{http_code}" "$base/gradle-${version}.jar" || true)
            if [ "$pom" = "200" ] && [ "$jar" = "200" ]; then
              echo "JitPack artifacts ready: $version"
              exit 0
            fi
            echo "Attempt $i: pom HTTP $pom, jar HTTP $jar, retrying in 15s"
            sleep 15
          done
          echo "JitPack artifacts not ready, continuing anyway"
          exit 0

      - name: Unit tests
        run: |
          chmod +x gradlew
          for i in $(seq 1 6); do
            if ./gradlew testDebugUnitTest; then exit 0; fi
            echo "Gradle attempt $i failed (transient JitPack/network failures are retried), sleeping 20s"
            sleep 20
          done
          exit 1

      - name: Build Plugins & JSON
        run: |
          for i in $(seq 1 3); do
            if ./gradlew make makePluginsJson; then exit 0; fi
            echo "Gradle attempt $i failed, sleeping 20s"
            sleep 20
          done
          exit 1

      - name: Point generated plugin URLs at builds-dev
        run: |
          sed -i 's#/builds/#/builds-dev/#g' build/plugins.json
          cat build/plugins.json

      - name: Prepare Deployment Folder
        run: |
          mkdir -p output_builds
          find . -type f -name '*.cs3' -not -path './output_builds/*' -exec cp {} output_builds/ \;
          cp build/plugins.json output_builds/ || true
          ls -la output_builds

      - name: Deploy to Dev Builds Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output_builds
          publish_branch: builds-dev
          force_orphan: true
          commit_message: "Build CS3 plugins (dev)"
