name: Build CS3 Plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build Plugins & JSON
        run: ./gradlew make makePluginsJson

      - name: Prepare Deployment Folder
        run: |
          mkdir -p output_builds
          find . -type f -name '*.cs3' -not -path './output_builds/*' -exec cp {} output_builds/ \;
          cp build/plugins.json output_builds/ || true
          ls -la output_builds

      - name: Deploy to Builds Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output_builds
          publish_branch: builds
          force_orphan: true
          commit_message: "Build CS3 plugins"
